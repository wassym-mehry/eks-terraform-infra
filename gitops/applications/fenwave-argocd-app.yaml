apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fenwave-idp
  namespace: argocd
  labels:
    app: fenwave-idp
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  .
  # Source du code - Helm Chart
  source:
    repoURL: https://github.com/Fenleap/Fenwave-backstage.git
    targetRevision: release/v1.3.0
    path: helm-chart
    helm:
      valueFiles:
        - values-production.yaml
      parameters:
        - name: backstage.image.tag
          value: latest
  
  # Destination dans le cluster
  destination:
    server: https://kubernetes.default.svc
    namespace: fenwave
  
  # Synchronisation automatique
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  
  # Options de révision
  revisionHistoryLimit: 10
  
  # Health checks
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas