apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Helm chart reference
helmCharts:
  - name: fenwave-idp
    repo: https://github.com/Fenleap/Fenwave-backstage.git
    version: 1.0.0
    releaseName: fenwave-backstage
    namespace: fenwave
    valuesInline:
      backstage:
        image:
          repository: 954976325487.dkr.ecr.eu-west-1.amazonaws.com/eks-infrastructure/idp
          tag: v8   # you had "latest" and also "newTag: v8" -> I kept v8
          pullPolicy: Always
        replicaCount: 1
        resources:
          limits:
            cpu: 2000m
            memory: 2Gi
          requests:
            cpu: 1000m
            memory: 1Gi
      postgresql:
        enabled: true
        auth:
          postgresPassword: "backstage_password"
          username: "backstage_user"
          password: "backstage_password"
          database: "backstage_db"

# Other resources
resources:
  - namespace.yaml
  - deployment.yaml
  - postgres.yaml
